rules:
  # Bronze
  action-setup: done
  appropriate-polling:
    status: done
    comment: >
      Home Assistant's Bluetooth coordinator reads the status at an
      advertisement when one is due (hourly, or after a failure, with a
      back-off), after commands, around schedule starts and ends, and on
      request.
  brands:
    status: done
    comment: Brand images ship in the integration's brand folder.
  common-modules: done
  config-flow-test-coverage: done
  config-flow: done
  dependency-transparency: done
  docs-actions: done
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup:
    status: exempt
    comment: >
      A battery device that is often briefly out of range. Setup succeeds,
      and the device's entities are unavailable until it is heard.
  unique-config-entry: done

  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow:
    status: exempt
    comment: The device has no account or credentials.
  test-coverage: done

  # Gold
  devices: done
  diagnostics: done
  discovery-update-info:
    status: exempt
    comment: Bluetooth devices keep their address; there is nothing to update.
  discovery: done
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices:
    status: exempt
    comment: Each config entry is one device.
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default: done
  entity-translations: done
  exception-translations: done
  icon-translations: done
  reconfiguration-flow: done
  repair-issues:
    status: exempt
    comment: No issue needs the user to act outside the device's own entities.
  stale-devices:
    status: exempt
    comment: Each config entry is one device; deleting the entry removes it.

  # Platinum
  async-dependency: done
  inject-websession:
    status: exempt
    comment: The integration makes no HTTP requests.
  strict-typing: done
